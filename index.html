<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ultimate Bowl</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  :root{ --bg:#07080d; --s1:rgba(14,17,26,.6); --s2:rgba(255,255,255,.07); --hud:rgba(12,15,23,.5); --line:rgba(255,255,255,.1); --txt:#f2f4fa; --dim:#a0a7bd; --a:#3ddcff; --gold:#ffc94d; }
  /* frosted glass: flat tint, blurred backdrop, no borders or glows */
  .panel,#board,#spin,#hint,#stat,#tools button{-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  canvas#c.drag{cursor:grabbing}
  .layer{position:fixed;inset:0;pointer-events:none}
  .hidden{display:none !important}

  /* ---------- loader ---------- */
  #loader{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:var(--bg);z-index:50;transition:opacity .4s}
  #loader .spin{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--a);animation:sp .9s linear infinite}
  #loader p{color:var(--dim);font-size:13px;text-align:center;padding:0 20px;line-height:1.5}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---------- panels (menu / results) ---------- */
  .center{display:flex;align-items:center;justify-content:center;padding:16px}
  .panel{pointer-events:auto;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:32px;width:min(380px,100%);animation:pop .25s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}}
  h1.logo{font-size:30px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
  h1.logo span{color:var(--a)}
  .tag{color:var(--dim);font-size:13px;margin:6px 0 28px}
  .lbl{font-size:12px;color:var(--dim);margin-bottom:8px}
  .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
  .seg button{height:42px;border-radius:8px;border:0;background:var(--s2);color:var(--dim);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:background .12s,color .12s}
  .seg button:hover{color:var(--txt)}
  .seg button.on{background:var(--a);color:#04121a}
  #names{display:grid;gap:6px;margin-bottom:24px;max-height:186px;overflow-y:auto}
  #names,#rank,#roomPlayers,#roomList{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
  #names::-webkit-scrollbar,#rank::-webkit-scrollbar,#roomPlayers::-webkit-scrollbar,#roomList::-webkit-scrollbar{width:6px}
  #names::-webkit-scrollbar-thumb,#rank::-webkit-scrollbar-thumb,#roomPlayers::-webkit-scrollbar-thumb,#roomList::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:3px}
  .seg.many{grid-template-columns:repeat(6,1fr)}
  .seg.many button{height:36px;font-size:14px}
  .panel{position:relative}
  .lang{position:absolute;top:30px;right:32px;display:flex;gap:2px;background:var(--s2);border-radius:8px;padding:2px}
  .lang button{height:26px;padding:0 9px;border:0;border-radius:6px;background:none;color:var(--dim);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
  .lang button.on{background:var(--a);color:#04121a}
  .row.me{opacity:1}
  .pname small{color:var(--a);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-left:-2px}
  .sep{height:1px;background:var(--line);margin:1px 6px}
  .more{font-size:11px;color:var(--dim);text-align:center;padding:1px 0 2px}
  .nm{display:flex;align-items:center;gap:10px;background:var(--s2);border-radius:8px;padding:0 12px;height:42px}
  .nm i{width:10px;height:10px;border-radius:50%;flex:none}
  .nm select{background:none;border:0;outline:0;color:var(--dim);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;text-align:right}
  .nm select:hover{color:var(--txt)}
  .nm option{background:#151821;color:var(--txt)}
  .nm input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--txt);font-family:inherit;font-size:14px;font-weight:500;-webkit-user-select:text;user-select:text}
  .btn{width:100%;height:48px;border-radius:8px;border:0;cursor:pointer;font-family:inherit;font-size:15px;font-weight:700;color:#04121a;background:var(--a);transition:filter .12s}
  .btn:hover{filter:brightness(1.12)}
  .btn.ghost{background:var(--s2);color:var(--txt)}
  .seg.two{grid-template-columns:1fr 1fr;margin-bottom:20px}
  .btn:disabled{opacity:.45;cursor:default;filter:none}
  .join{display:grid;grid-template-columns:1fr auto;gap:6px}
  .join input{height:48px;min-width:0;border-radius:8px;border:0;outline:0;background:var(--s2);color:var(--txt);font-family:inherit;font-size:17px;font-weight:700;
    letter-spacing:.3em;text-align:center;text-transform:uppercase;-webkit-user-select:text;user-select:text}
  .join input::placeholder{color:var(--dim);opacity:.6}
  .join .btn{width:auto;padding:0 24px}
  #roomList{display:grid;gap:6px;max-height:144px;overflow-y:auto}
  .rl{display:flex;align-items:center;gap:10px;height:42px;padding:0 6px 0 12px;border-radius:8px;background:var(--s2);font-size:14px;font-weight:500}
  .rl span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rl small,.nm small{color:var(--dim);font-size:12px;font-weight:500}
  .rl button{height:30px;padding:0 14px;border-radius:6px;border:0;background:var(--a);color:#04121a;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .empty{color:var(--dim);font-size:13px;padding:8px 0}
  .code{font-size:40px;font-weight:800;letter-spacing:.2em;line-height:1.1;margin:2px 0 8px;-webkit-user-select:text;user-select:text}
  #roomPlayers{display:grid;gap:6px;margin:16px 0 20px;max-height:234px;overflow-y:auto}
  .nm .pn{flex:1;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #netMsg{color:var(--gold)} #netMsg:empty{display:none}
  .row.gone .pname span{text-decoration:line-through}
  .how{margin-top:18px;color:var(--dim);font-size:12.5px;line-height:1.6}

  /* ---------- scoreboard ---------- */
  #hud{z-index:5}
  #boardWrap{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:center}
  #board{transform-origin:top center;background:var(--hud);border:1px solid var(--line);border-radius:16px;padding:6px;display:grid;gap:4px}
  .row{display:flex;align-items:stretch;gap:3px;border-radius:11px;padding:3px;opacity:.6;transition:opacity .25s,background .25s}
  .row.cur{opacity:1;background:rgba(255,255,255,.07)}
  .pname{width:104px;display:flex;align-items:center;gap:8px;padding:0 8px;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden}
  .pname i{width:10px;height:10px;border-radius:50%;flex:none}
  .pname span{overflow:hidden;text-overflow:ellipsis}
  .fr{width:40px;border-radius:7px;background:rgba(255,255,255,.05);display:flex;flex-direction:column;overflow:hidden}
  .fr.t{width:58px}
  .fr.act{box-shadow:inset 0 0 0 1.5px var(--a)}
  .mk{display:flex;height:17px}
  .mk b{flex:1;font-size:12.5px;font-weight:800;text-align:center;line-height:17px;color:#fff}
  .mk b+b{background:rgba(255,255,255,.06);border-radius:0 0 0 5px}
  .mk b.x{color:var(--gold)} .mk b.s{color:var(--a)}
  .cm{height:19px;font-size:13px;font-weight:800;text-align:center;line-height:18px}
  .tot{width:50px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;border-radius:7px;background:rgba(255,255,255,.07)}

  /* ---------- in-game controls ---------- */
  #chip{display:none}
  #spin{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);pointer-events:auto;display:flex;align-items:center;gap:12px;height:38px;padding:0 14px;
    border-radius:10px;background:var(--hud);transition:opacity .25s}
  #spin.off{opacity:0;pointer-events:none}
  #spin .sl{font-size:12px;color:var(--dim)}
  #spinVal{width:70px;text-align:right;font-size:12px;font-weight:600}
  #spinIn{-webkit-appearance:none;appearance:none;width:min(200px,38vw);height:4px;border-radius:2px;outline:0;cursor:pointer;background:rgba(255,255,255,.22)}
  #spinIn::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--a);border:0}
  #spinIn::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--a);border:0}
  #hint{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);padding:7px 12px;border-radius:8px;background:var(--hud);
    font-size:12.5px;color:var(--dim);white-space:nowrap;transition:opacity .25s}
  #hint b{color:var(--txt);font-weight:600}
  #stat{position:absolute;right:16px;bottom:16px;height:38px;padding:0 14px;border-radius:10px;background:var(--hud);display:flex;align-items:center;gap:10px;transition:opacity .25s;opacity:0}
  #stat .v{font-size:16px;font-weight:800}
  #stat .v small{font-size:12px;font-weight:500;color:var(--dim);margin-left:3px}
  #stat .k{font-size:12px;color:var(--dim)}
  #tools{position:absolute;right:10px;top:10px;display:flex;gap:4px;pointer-events:auto}
  #tools button{width:36px;height:36px;border-radius:8px;border:0;background:var(--hud);color:var(--dim);cursor:pointer;display:grid;place-items:center;transition:color .12s}
  #tools button:hover{color:var(--txt)}
  #tools svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- banner ---------- */
  #banner{z-index:6;display:flex;align-items:center;justify-content:center;flex-direction:column;padding-bottom:14vh}
  #banner .big{font-size:clamp(48px,11vw,120px);font-weight:800;letter-spacing:-.02em;line-height:1;color:#fff;opacity:0;text-shadow:0 2px 24px rgba(0,0,0,.55)}
  #banner .sub{font-size:clamp(13px,2vw,18px);font-weight:500;color:#fff;opacity:0;margin-top:8px;text-shadow:0 1px 10px rgba(0,0,0,.7)}
  #banner.show .big{animation:bang 1.7s ease-out forwards}
  #banner.show .sub{animation:fadeio 1.7s ease forwards}
  #banner.gold .big{color:var(--gold)}
  #banner.cyan .big{color:var(--a)}
  #banner.turn .big{font-size:clamp(32px,6vw,64px)}
  @keyframes bang{0%{opacity:0;transform:scale(1.25)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
  @keyframes fadeio{0%,10%{opacity:0}25%,80%{opacity:1}100%{opacity:0}}

  /* ---------- results ---------- */
  #results h2{font-size:26px;font-weight:800;letter-spacing:-.01em}
  #rank{margin:20px 0 24px;max-height:50vh;overflow-y:auto}
  .rk{display:flex;align-items:center;gap:12px;height:48px;font-weight:600;border-top:1px solid var(--line)}
  .rk:last-child{border-bottom:1px solid var(--line)}
  .rk .pos{width:14px;color:var(--dim);font-size:13px}
  .rk i{width:8px;height:8px;border-radius:50%}
  .rk .nm2{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rk .sc{font-size:20px;font-weight:800}
  .rk.win .sc,.rk.win .pos{color:var(--gold)}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}

  @media (max-width:640px){
    .panel{padding:24px}
    #hint{white-space:normal;text-align:center;width:calc(100% - 32px)}
    #stat{bottom:62px}
    #tools{top:auto;bottom:16px;right:10px}
    #spinIn{width:30vw}
  }
</style>

{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<body>
<canvas id="c"></canvas>

<div id="loader" class="layer"><div class="spin"></div><p id="loadMsg">…</p></div>

<!-- MENU -->
<div id="menu" class="layer center hidden" style="z-index:10">
  <div class="panel">
    <div class="lang" id="lang"><button data-l="en">EN</button><button data-l="de">DE</button></div>
    <h1 class="logo">Ultimate <span>Bowl</span></h1>
    <div class="tag" data-i="tag"></div>
    <div class="seg two" id="mode"><button data-m="local" class="on" data-i="local"></button><button data-m="online" data-i="online"></button></div>

    <div id="vLocal">
      <div class="lbl" data-i="players"></div>
      <div class="seg many" id="seg"></div>
      <div id="names"></div>
      <button class="btn" id="startBtn" data-i="start"></button>
    </div>

    <div id="vOnline" class="hidden">
      <div class="lbl" data-i="you"></div>
      <div class="nm"><i style="background:var(--a)"></i><input id="myName" maxlength="10" data-ip="yourName" spellcheck="false"><select id="myLb" data-it="ballWeight"></select></div>
      <div class="lbl" style="margin-top:16px" data-i="createRoom"></div>
      <div class="btns"><button class="btn" id="mkPublic" data-i="public"></button><button class="btn ghost" id="mkPrivate" data-i="private"></button></div>
      <div class="lbl" style="margin-top:16px" data-i="joinCode"></div>
      <div class="join"><input id="joinCode" maxlength="5" placeholder="CODE" autocapitalize="characters" autocomplete="off" spellcheck="false" aria-label="Code"><button class="btn ghost" id="joinBtn" data-i="join"></button></div>
      <div class="lbl" style="margin-top:16px" data-i="publicRooms"></div>
      <div id="roomList"></div>
    </div>

    <div id="vRoom" class="hidden">
      <div class="lbl" id="roomKind">Private room</div>
      <div class="code" id="roomCode"></div>
      <div class="lbl" id="roomHelp"></div>
      <div id="roomPlayers"></div>
      <div class="btns"><button class="btn ghost" id="leaveBtn" data-i="leave"></button><button class="btn" id="goBtn"></button></div>
    </div>

    <div class="how" id="netMsg"></div>
    <div class="how" id="how" data-i="how"></div>
  </div>
</div>

<!-- HUD -->
<div id="hud" class="layer hidden">
  <div id="boardWrap"><div id="board"></div></div>
  <div id="tools">
    <button id="muteBtn" data-it="sound"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path id="sndOn" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
    <button id="quitBtn" data-it="toMenu"><svg viewBox="0 0 24 24"><path d="M3 12 12 4l9 8"/><path d="M6 10v9h12v-9"/></svg></button>
  </div>
  <div id="chip"><i></i><div><div class="n"></div><div class="s"></div></div></div>
  <div id="spin" class="off"><span class="sl" data-i="spin"></span><input type="range" id="spinIn" min="-100" max="100" step="5" value="0" data-it="spin"><b id="spinVal">None</b></div>
  <div id="hint"></div>
  <div id="stat"><div class="v"></div><div class="k"></div></div>
</div>

<div id="banner" class="layer"><div class="big"></div><div class="sub"></div></div>

<!-- RESULTS -->
<div id="results" class="layer center hidden" style="z-index:10">
  <div class="panel">
    <h2 id="resTitle">Final scores</h2>
    <div class="tag" style="margin-bottom:0" id="resSub"></div>
    <div id="rank"></div>
    <div class="btns"><button class="btn ghost" id="menuBtn" data-i="menu"></button><button class="btn" id="againBtn"></button></div>
  </div>
</div>

<script>
  setTimeout(()=>{ if(!window.__ready){ const m=document.getElementById('loadMsg'); if(m) m.innerHTML='Still loading…<br>The 3D engine comes from a CDN, so an internet connection is required.'; } }, 9000);
</script>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import * as RAPIER_NS from 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.12.0/rapier.es.js';

const RAPIER = RAPIER_NS.default ?? RAPIER_NS;
await RAPIER.init();

/* =====================================================================
   Constants & helpers
   ===================================================================== */
const LANE_W = 1.0668, HALF = LANE_W / 2;        // regulation lane width
const LANE_END = -19.25, HEAD = -18.29;          // lane runs toward -Z, foul line at z=0
const GUT_W = 0.235, GUT_D = GUT_W / 2;
const DIV_W = 0.26;
const PITCH = LANE_W + 2 * GUT_W + DIV_W;        // distance between lane centres
const BALL_R = 0.1085, BALL_MASS = 6.8;
const PIN_H = 0.381;
const HOUSE_W = 5 * PITCH + DIV_W;
const MAXP = 12;                                   // most players in one game, local or online
const COLORS = ['#2f7bff', '#ff3b5c', '#19c37d', '#ffb020', '#b05cff', '#00c2d1', '#ff7a1a', '#ff5fb8', '#9bd13a', '#d9dde8', '#a0623a', '#4a5068'];
const AIM_START = new THREE.Vector3(0, BALL_R, 1.9);

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* =====================================================================
   Renderer / scene
   ===================================================================== */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060c);
scene.fog = new THREE.Fog(0x05060c, 24, 46);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 80);
const camLook = new THREE.Vector3(0, .3, -18.6);
camera.position.set(0, 1, -14);

const rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.22, 0.6, 1.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0xc4d6ff, 0x24160a, 0.6));
const sun = new THREE.DirectionalLight(0xfff0dc, 2.3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 0.5, far: 20 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.012;
scene.add(sun, sun.target);
const pinSpot = new THREE.SpotLight(0xffffff, 26, 9, 0.62, 0.6, 1.4);
pinSpot.position.set(0, 1.9, -16.6); pinSpot.target.position.set(0, 0.1, -18.8);
scene.add(pinSpot, pinSpot.target);
const mag = new THREE.PointLight(0xff3df0, 9, 22, 1.6); mag.position.set(-3.6, 2.2, -8); scene.add(mag);
const cya = new THREE.PointLight(0x2fd8ff, 9, 22, 1.6); cya.position.set(3.6, 2.2, -8); scene.add(cya);

/* =====================================================================
   Procedural textures
   ===================================================================== */
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function finishTex(c) {
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso;
  return t;
}
function drawBoards(g, W, H) {
  const boards = 39, bw = W / boards;
  for (let i = 0; i < boards; i++) {
    g.fillStyle = `hsl(${31 + Math.random() * 7},${52 + Math.random() * 10}%,${60 + Math.random() * 11}%)`;
    g.fillRect(i * bw, 0, bw + 1, H);
    for (let k = 0; k < 12; k++) {
      g.strokeStyle = `rgba(110,62,18,${0.04 + Math.random() * 0.09})`; g.lineWidth = 1;
      const x = i * bw + Math.random() * bw;
      g.beginPath(); g.moveTo(x, 0);
      for (let y = 0; y < H;) { y += 40 + Math.random() * 160; g.lineTo(x + (Math.random() - .5) * 2.5, y); }
      g.stroke();
    }
    g.fillStyle = 'rgba(60,30,6,.4)'; g.fillRect(i * bw, 0, 1.2, H);
  }
  return bw;
}
function laneTexture() {
  const W = 1024, H = 4096, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'), bw = drawBoards(g, W, H);
  const py = z => (z - LANE_END) / (-LANE_END) * H, pxm = H / -LANE_END, pxx = W / LANE_W;

const BOARD_ROWS = 4;
function renderBoard() {

  const n = order.length;
  const focus = Math.max(0, order.findIndex(i => i >= Math.max(G.cur, 0)));   // the player up, or (on your turn) the one after you

/* ---------- flow ---------- */
const myTurn = () => !G.online || G.players[G.cur]?.id === NET.id;
const rollSeq = () => G.players.reduce((n, p) => n + p.rolls.length, 0);     // rolls thrown so far = id of the next roll
function startGame(list, online = false) {
  G.sess++;
  G.online = online;
  G.players = list.map((p, i) => ({ id: p.id, name: (p.name || '').trim() || t('player') + ' ' + (i + 1), lb: p.lb || 14, color: COLORS[i], rolls: [], streak: 0, gone: false }));
  G.cur = 0; G.frame = 0; G.ball = 0; G.fresh = true;
  tweens.length = 0;
  resetPins(true); pins.forEach(p => p.drop = 0); sweeper.position.y = .95;
  ui.banner.classList.remove('show');
  ui.menu.classList.add('hidden'); ui.results.classList.add('hidden'); ui.hud.classList.remove('hidden'); ui.chip.style.visibility = '';
  beginTurn(G.players.length > 1);
}
function beginTurn(announce) {
  const p = G.players[G.cur];
  if (G.online && p.gone) return skipTurn();
  const mine = myTurn();
  G.state = 'aim';
  ballBody.setEnabled(false);
  ballMat.map = ballTex[G.cur]; ballMat.needsUpdate = true;
  ballCol.setMass(p.lb * LB);
  aimPos.copy(AIM_START); aimTarget.copy(AIM_START);
  ballMesh.position.copy(aimPos); ballMesh.quaternion.set(-.45, 0, 0, .89).normalize(); ballMesh.visible = true;
  renderBoard(); renderChip(); ui.stat.style.opacity = 0;
  showHint(mine ? (hintSeen ? null : t('hint')) : t('waitingFor', { n: esc(p.name) }));
  spinUI.classList.toggle('off', !mine); canvas.style.cursor = mine ? '' : 'default';
  if (announce) setSpin(0);
  if (announce) { banner(G.online && mine ? t('yourTurn') : p.name, G.online && mine ? '' : t('youreUp'), 'turn'); tone(660, 0, .18, .12); tone(880, .1, .25, .12); }
}
// move on to the next player who is still in the game; true when the game is over
function advance() {
  const n = G.players.length; G.ball = 0;
  if (!G.players.some(p => !p.gone)) return true;
  do { G.cur++; if (G.cur >= n) { G.cur = 0; G.frame++; } } while (G.frame < 10 && G.players[G.cur].gone);
  return G.frame >= 10;
}
function skipTurn() {                                  // the player whose turn it is has left an online game
  G.fresh = true; resetPins(true); pins.forEach(p => p.drop = 0);
  if (advance()) { G.cur = -1; return gameOver(); }
  beginTurn(true);
}
function throwBall(speed, angle, spin, loft = false, remote = false) {
  if (G.online && !remote) netSend('throw', { q: rollSeq(), x: aimPos.x, z: aimPos.z, sp: speed, an: angle, si: spin, lo: loft ? 1 : 0, r: ballMesh.quaternion.toArray() }, 1);
  // keep the ball inside the gutters at the foul line
  const maxA = Math.atan2(.72 - Math.abs(aimPos.x), Math.max(aimPos.z, .2));
  angle = clamp(angle, -Math.max(maxA, .02), Math.max(maxA, .02));
  const vx = Math.sin(angle) * speed, vz = -Math.cos(angle) * speed;
  ballBody.setEnabled(true);
  ballBody.setTranslation({ x: aimPos.x, y: BALL_R + .002, z: aimPos.z }, true);
  const q = ballMesh.quaternion; ballBody.setRotation({ x: q.x, y: q.y, z: q.z, w: q.w }, true);
  ballBody.setLinvel({ x: vx, y: loft ? 2.3 : 0, z: vz }, true);          // lofted: lobbed from the hand, lands ~0.5 s later
  if (loft) tone(85, .46, .22, .4, 'sine');
  ballBody.setAngvel({ x: .7 * vz / BALL_R, y: 0, z: -.7 * vx / BALL_R + spin }, true);
  Object.assign(roll, { t: 0, done: 0, isDone: false, gutter: false, still: 0 });
  G.state = 'roll';
  showHint(null); spinUI.classList.add('off'); if (!remote) hintSeen = true;
  ui.stat.querySelector('.v').innerHTML = `${(speed * 3.6).toFixed(0)}<small>km/h</small>`;
  ui.stat.querySelector('.k').textContent = t(Math.abs(spin) < 1.5 ? 'straight' : spin > 0 ? 'hookL' : 'hookR');
  ui.stat.style.opacity = 1;
}
// remote = the thrower's result in an online game ({k: pins knocked, p: pins left standing}); it overrides the local simulation
async function resolveRoll(remote) {
  const sess = G.sess, p = G.players[G.cur], n = G.players.length, seq = rollSeq();
  G.state = 'result';
  const before = pins.filter(x => x.active).length;
  const knocked = remote ? remote.k : pins.filter(x => x.active && pinDown(x)).length;
  const left = remote ? remote.p : pins.map(x => { if (!x.active || pinDown(x)) return 0; const t = x.body.translation(); return [+t.x.toFixed(4), +t.z.toFixed(4)]; });
  const cleared = knocked === before;
  p.rolls.push(knocked);

  if (cleared && G.fresh) {
    p.streak++;
    banner(t(p.streak >= 3 ? 'turkey' : p.streak === 2 ? 'double' : 'strike'), p.streak >= 3 ? t('inRow', { n: p.streak }) : '', 'gold');
    jingle([523, 659, 784, 1047, 1319], .09, .22);
  } else {
    p.streak = 0;
    if (cleared) { banner(t('spare'), '', 'cyan'); jingle([523, 784, 1047], .1, .2); }
    else if (knocked === 0) { banner(t(roll.gutter ? 'gutter' : 'miss'), '', ''); tone(180, 0, .4, .2, 'sawtooth'); }
    else banner(String(knocked), t(knocked === 1 ? 'pin' : 'pins'), '');
  }

  let reset = true, next = true;                       // reset = full rack
  if (G.frame < 9) {
    if (G.ball === 0 && !cleared) { next = false; reset = false; G.ball = 1; }
  } else if (G.ball === 0) { next = false; G.ball = 1; reset = cleared; }
  else if (G.ball === 1) {
    const first = p.rolls[p.rolls.length - 2];
    if (first === 10) { next = false; G.ball = 2; reset = cleared; }
    else if (cleared) { next = false; G.ball = 2; reset = true; }
  }
  G.fresh = reset;
  let over = false;
  if (next && advance()) { over = true; G.cur = -1; }
  if (G.online && !remote) netSend('result', { q: seq, k: knocked, p: left, s: snapshot(over) }, 1);
  const shown = G.cur; if (next && !over) G.cur = G.players.indexOf(p);   // keep highlight on the thrower until the sweep is done
  renderBoard(); G.cur = shown;

  await wait(1750); if (sess !== G.sess) return;
  await sweep(reset, left); if (sess !== G.sess) return;
  if (over) return gameOver();
  beginTurn(next && n > 1);
}
async function sweep(full, left) {
  const sess = G.sess;
  G.state = 'sweep';
  await tween(380, k => { sweeper.position.y = lerp(.95, .13, ease(k)); }); if (sess !== G.sess) return;
  ballBody.setEnabled(false); ballMesh.visible = false;
  resetPins(full, left);
  await tween(520, k => { sweeper.position.y = lerp(.13, .95, ease(k)); for (const p of pins) if (p.drop) p.drop = .45 * (1 - ease(k)); });
  for (const p of pins) p.drop = 0;
}
function gameOver() {

  const rank = G.players.map(p => ({ p, s: scoreFrames(p.rolls).total })).sort((a, b) => b.s - a.s);

    `<div class="rk${r.s === top ? ' win' : ''}"><span class="pos">${i + 1}</span><i style="background:${r.p.color}"></i><span class="nm2">${esc(r.p.name)}${r.p.gone ? t('leftTag') : ''}</span><span class="sc">${r.s}</span></div>`).join('');

/* =====================================================================
   Online multiplayer
   There is no game server. Players in a room exchange small JSON messages through a public MQTT broker
   (over WebSocket). Whoever's turn it is simulates the throw; everyone else replays the same throw locally
   and then takes the thrower's result (pins knocked, pins left standing, scores) as authoritative.
   ===================================================================== */
const BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt', 'wss://test.mosquitto.org:8081/mqtt'];
// the first letter of a room code says which broker the room lives on, so a code is enough to find it
const CODE_SETS = ['ABCDEFGH', 'JKLMNPQR', 'STUVWXYZ'], CODE_REST = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const TOPIC = 'ultimatebowl/v1/';
const NET = { id: Math.random().toString(36).slice(2, 10), client: null, bi: -1, room: null, host: false, hostId: null, joined: false,
  players: [], seen: new Map(), lobby: new Map(), pThrow: null, pResult: null, timers: [], lastAim: 0 };
let netMsgKey = '';
const netMsg = k => { netMsgKey = k || ''; $('#netMsg').textContent = netMsgKey ? t(netMsgKey) : ''; };
const roomTopic = () => TOPIC + 'room/' + NET.room.code;
const brokerOf = code => CODE_SETS.findIndex(s => s.includes(code[0]));
const me = () => ({ id: NET.id, name: ($('#myName').value.trim() || t('player')).slice(0, 10), lb: +$('#myLb').value || 14 });
function genCode() { let c = CODE_SETS[NET.bi][Math.random() * 8 | 0]; for (let i = 0; i < 4; i++) c += CODE_REST[Math.random() * CODE_REST.length | 0]; return c; }
function netSend(t, data = {}, qos = 0) { if (NET.client && NET.room) NET.client.publish(roomTopic(), JSON.stringify({ t, f: NET.id, ...data }), { qos }); }
function netEvery(ms, fn) { NET.timers.push(setInterval(fn, ms)); }
function netClearTimers() { NET.timers.forEach(clearInterval); NET.timers = []; }

function loadMqtt() {
  return window.mqtt ? Promise.resolve() : new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js';
    s.onload = res; s.onerror = () => rej(new Error('eLib')); document.head.appendChild(s);
  });
}
function tryBroker(i) {
  return new Promise((res, rej) => {
    if (NET.client && NET.bi === i && NET.client.connected) return res();
    if (NET.client) { try { NET.client.end(true); } catch (_) {} NET.client = null; NET.bi = -1; NET.lobby.clear(); }
    const c = mqtt.connect(BROKERS[i], { clientId: 'ub_' + NET.id + '_' + Date.now().toString(36), clean: true, connectTimeout: 7000, reconnectPeriod: 3000, keepalive: 30 });
    let done = false;

  rollGain.gain.setTargetAtTime(g, actx.currentTime, .06);
  rollFilter.frequency.setTargetAtTime(f, actx.currentTime, .1);
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, .05); last = now; time += dt;
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; tw.t += dt * 1000; const k = Math.min(tw.t / tw.dur, 1);
    if (tw.fn) tw.fn(k);
    if (k >= 1) { tweens.splice(tweens.indexOf(tw), 1); tw.res(); }
  }
  acc += dt; while (acc >= DT) { stepPhysics(); acc -= DT; }
  syncMeshes(); netTick(); updateGame(dt); updateCamera(dt); updateAudio();
  composer.render();
}
function resize() {                                    // size from the canvas's real on-screen box (CSS keeps it full-window)
  const w = Math.max(canvas.clientWidth, 1), h = Math.max(canvas.clientHeight, 1);
  camera.aspect = w / h; camera.fov = camera.aspect < 1 ? 62 : 50; camera.updateProjectionMatrix();
  renderer.setSize(w, h, false); composer.setSize(w, h); fitBoard();
}
canvas.style.width = canvas.style.height = '';
new ResizeObserver(resize).observe(canvas);
addEventListener('resize', resize);
resize();

window.__ready = true;
window.__game = { G, NET, frame, pins, ballBody, ballCol, stepPhysics, resetPins, pinDown, throwBall, aimPos, aimTarget, roll, scoreFrames,
  project(v) { const p = v.clone().project(camera), r = canvas.getBoundingClientRect(); return [r.left + (p.x + 1) / 2 * r.width, r.top + (1 - p.y) / 2 * r.height]; } };   // handy for debugging in the console
$('#loader').style.opacity = 0; setTimeout(() => $('#loader').classList.add('hidden'), 500);
ui.menu.classList.remove('hidden');
requestAnimationFrame(frame);
</script>
